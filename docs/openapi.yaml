openapi: 3.0.3
info:
  title: Laravel Sales Commission Pro API
  description: |
    Comprehensive REST API for managing sales commissions in Laravel applications.

    ## Authentication
    Endpoints require Bearer token authentication. Works with Laravel Sanctum, Passport, JWT, or any Laravel auth guard.

    ```bash
    curl -H "Authorization: Bearer YOUR_API_TOKEN" \
         -H "Accept: application/json" \
         https://your-app.com/api/commissions/plans
    ```

    ## Base URL
    All endpoints are prefixed with `/api/commissions`
  version: 1.0.0
  contact:
    email: ayangefelix8@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://your-app.com/api/commissions
    description: Production server
  - url: http://localhost/api/commissions
    description: Local development

tags:
  - name: Commission Plans
    description: Manage commission plans and their configuration
  - name: Commission Tiers
    description: Manage tier structures within plans
  - name: Commission Rules
    description: Manage commission calculation rules
  - name: Earnings
    description: Track and manage commission earnings
  - name: Payouts
    description: Generate, approve, and process payouts
  - name: Clawbacks
    description: Handle commission reversals
  - name: Agents
    description: Agent-specific earnings and statistics
  - name: Splits
    description: Team commission splits
  - name: Calculate
    description: Commission calculation endpoints
  - name: Statistics
    description: Analytics and reporting

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token

  schemas:
    CommissionPlan:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Standard Sales Plan"
        slug:
          type: string
          example: "standard"
        description:
          type: string
          nullable: true
          example: "Default commission plan for sales team"
        is_active:
          type: boolean
          example: true
        is_default:
          type: boolean
          example: true
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/CommissionTier"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/CommissionRule"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommissionTier:
      type: object
      properties:
        id:
          type: integer
          example: 1
        plan_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Gold"
        min_threshold:
          type: number
          format: float
          example: 50000.00
        max_threshold:
          type: number
          format: float
          nullable: true
          example: null
        rate:
          type: number
          format: float
          example: 10.00
        bonus_amount:
          type: number
          format: float
          nullable: true
          example: 500.00

    CommissionRule:
      type: object
      properties:
        id:
          type: integer
          example: 1
        plan_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Base Commission"
        type:
          type: string
          enum: [percentage, fixed, tiered, bonus_threshold]
          example: "percentage"
        value:
          type: number
          format: float
          example: 10.00
        priority:
          type: integer
          example: 1
        is_active:
          type: boolean
          example: true
        conditions:
          type: object
          nullable: true

    CommissionEarning:
      type: object
      properties:
        id:
          type: string
          format: ulid
          example: "01HXK8VDKPWF9G5QJCNM2RY6T3"
        agent_id:
          type: string
          example: "1"
        agent_type:
          type: string
          example: "App\\Models\\User"
        plan_id:
          type: integer
          example: 1
        tier_id:
          type: integer
          nullable: true
        base_amount:
          type: number
          format: float
          example: 1000.00
        commission_amount:
          type: number
          format: float
          example: 100.00
        rate:
          type: number
          format: float
          example: 10.00
        rate_type:
          type: string
          enum: [percentage, fixed]
          example: "percentage"
        status:
          type: string
          enum: [pending, payable, paid, clawed_back]
          example: "payable"
        period:
          type: string
          example: "2026-01"
        earned_at:
          type: string
          format: date-time
        payout_id:
          type: string
          format: ulid
          nullable: true

    Payout:
      type: object
      properties:
        id:
          type: string
          format: ulid
          example: "01HXK8VDKPWF9G5QJCNM2RY6T4"
        period:
          type: string
          example: "2026-01"
        total_amount:
          type: number
          format: float
          example: 5000.00
        total_earnings_count:
          type: integer
          example: 15
        status:
          type: string
          enum: [draft, pending_approval, approved, paid, failed]
          example: "pending_approval"
        notes:
          type: string
          nullable: true
        approved_by:
          type: integer
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        processed_at:
          type: string
          format: date-time
          nullable: true
        payment_reference:
          type: string
          nullable: true
          example: "TXN-12345"
        payment_method:
          type: string
          nullable: true
          example: "bank_transfer"

    Clawback:
      type: object
      properties:
        id:
          type: string
          format: ulid
        earning_id:
          type: string
          format: ulid
        amount:
          type: number
          format: float
          example: 50.00
        reason:
          type: string
          enum: [refund, chargeback, cancellation, manual]
          example: "refund"
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CommissionSplit:
      type: object
      properties:
        id:
          type: string
          format: ulid
        earning_id:
          type: string
          format: ulid
        agent_id:
          type: string
        agent_type:
          type: string
        role:
          type: string
          example: "primary"
        split_percentage:
          type: number
          format: float
          example: 60.00
        split_amount:
          type: number
          format: float
          example: 60.00

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 75

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "The given data was invalid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

security:
  - bearerAuth: []

paths:
  # ========================================
  # COMMISSION PLANS
  # ========================================
  /plans:
    get:
      tags:
        - Commission Plans
      summary: List all commission plans
      parameters:
        - name: active_only
          in: query
          schema:
            type: boolean
          description: Filter to show only active plans
        - name: search
          in: query
          schema:
            type: string
          description: Search plans by name
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
          description: Items per page
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommissionPlan"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                data:
                  - id: 1
                    name: "Standard Sales Plan"
                    slug: "standard"
                    description: "Default commission plan"
                    is_active: true
                    is_default: true
                    tiers:
                      - id: 1
                        name: "Bronze"
                        min_threshold: 0
                        max_threshold: 10000
                        rate: 5.00
                      - id: 2
                        name: "Silver"
                        min_threshold: 10000
                        max_threshold: 50000
                        rate: 7.50
                      - id: 3
                        name: "Gold"
                        min_threshold: 50000
                        max_threshold: null
                        rate: 10.00
                    rules:
                      - id: 1
                        name: "Base Commission"
                        type: "tiered"
                        value: 0
                        priority: 1
                        is_active: true
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 15
                  total: 1
    post:
      tags:
        - Commission Plans
      summary: Create a new commission plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                  example: "Enterprise Plan"
                slug:
                  type: string
                  example: "enterprise"
                description:
                  type: string
                  example: "High-value client commission plan"
                is_active:
                  type: boolean
                  example: true
                is_default:
                  type: boolean
                  example: false
      responses:
        "201":
          description: Plan created successfully
          content:
            application/json:
              example:
                success: true
                message: "Commission plan created successfully."
                data:
                  id: 2
                  name: "Enterprise Plan"
                  slug: "enterprise"
                  description: "High-value client commission plan"
                  is_active: true
                  is_default: false
                  tiers: []
                  rules: []
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "The given data was invalid."
                errors:
                  slug:
                    - "The slug has already been taken."

  /plans/{id}:
    get:
      tags:
        - Commission Plans
      summary: Get a specific commission plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  name: "Standard Sales Plan"
                  slug: "standard"
                  description: "Default commission plan"
                  is_active: true
                  is_default: true
                  tiers:
                    - id: 1
                      name: "Bronze"
                      min_threshold: 0
                      max_threshold: 10000
                      rate: 5.00
                      bonus_amount: null
                    - id: 2
                      name: "Silver"
                      min_threshold: 10000
                      max_threshold: 50000
                      rate: 7.50
                      bonus_amount: 100.00
                    - id: 3
                      name: "Gold"
                      min_threshold: 50000
                      max_threshold: null
                      rate: 10.00
                      bonus_amount: 500.00
                  rules:
                    - id: 1
                      name: "Base Commission"
                      type: "tiered"
                      value: 0
                      priority: 1
                      is_active: true
        "404":
          description: Plan not found
          content:
            application/json:
              example:
                success: false
                message: "Commission plan not found."

    put:
      tags:
        - Commission Plans
      summary: Update a commission plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                is_active:
                  type: boolean
                is_default:
                  type: boolean
      responses:
        "200":
          description: Plan updated successfully
          content:
            application/json:
              example:
                success: true
                message: "Commission plan updated successfully."
                data:
                  id: 1
                  name: "Updated Plan Name"
                  slug: "standard"
                  is_active: true
                  is_default: true

    delete:
      tags:
        - Commission Plans
      summary: Delete a commission plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan deleted successfully
          content:
            application/json:
              example:
                success: true
                message: "Commission plan deleted successfully."

  /plans/{id}/activate:
    post:
      tags:
        - Commission Plans
      summary: Activate a commission plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan activated
          content:
            application/json:
              example:
                success: true
                message: "Commission plan activated."
                data:
                  id: 1
                  name: "Standard Sales Plan"
                  is_active: true

  /plans/{id}/deactivate:
    post:
      tags:
        - Commission Plans
      summary: Deactivate a commission plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan deactivated
          content:
            application/json:
              example:
                success: true
                message: "Commission plan deactivated."
                data:
                  id: 1
                  name: "Standard Sales Plan"
                  is_active: false

  /plans/{id}/set-default:
    post:
      tags:
        - Commission Plans
      summary: Set a plan as the default
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan set as default
          content:
            application/json:
              example:
                success: true
                message: "Commission plan set as default."
                data:
                  id: 1
                  name: "Standard Sales Plan"
                  is_default: true

  # ========================================
  # COMMISSION TIERS
  # ========================================
  /plans/{plan_id}/tiers:
    get:
      tags:
        - Commission Tiers
      summary: List all tiers for a plan
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 1
                    name: "Bronze"
                    min_threshold: 0
                    max_threshold: 10000
                    rate: 5.00
                    bonus_amount: null
                  - id: 2
                    name: "Silver"
                    min_threshold: 10000
                    max_threshold: 50000
                    rate: 7.50
                    bonus_amount: 100.00
                  - id: 3
                    name: "Gold"
                    min_threshold: 50000
                    max_threshold: null
                    rate: 10.00
                    bonus_amount: 500.00

    post:
      tags:
        - Commission Tiers
      summary: Create a new tier
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - min_threshold
                - rate
              properties:
                name:
                  type: string
                  example: "Platinum"
                min_threshold:
                  type: number
                  example: 100000
                max_threshold:
                  type: number
                  nullable: true
                  example: null
                rate:
                  type: number
                  example: 12.50
                bonus_amount:
                  type: number
                  nullable: true
                  example: 1000.00
      responses:
        "201":
          description: Tier created successfully
          content:
            application/json:
              example:
                success: true
                message: "Commission tier created successfully."
                data:
                  id: 4
                  name: "Platinum"
                  min_threshold: 100000
                  max_threshold: null
                  rate: 12.50
                  bonus_amount: 1000.00

  /tiers/{id}:
    get:
      tags:
        - Commission Tiers
      summary: Get a specific tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  id: 3
                  name: "Gold"
                  min_threshold: 50000
                  max_threshold: null
                  rate: 10.00
                  bonus_amount: 500.00

    put:
      tags:
        - Commission Tiers
      summary: Update a tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                min_threshold:
                  type: number
                max_threshold:
                  type: number
                rate:
                  type: number
                bonus_amount:
                  type: number
      responses:
        "200":
          description: Tier updated successfully
          content:
            application/json:
              example:
                success: true
                message: "Commission tier updated successfully."
                data:
                  id: 3
                  name: "Gold Elite"
                  rate: 12.00

    delete:
      tags:
        - Commission Tiers
      summary: Delete a tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tier deleted successfully
          content:
            application/json:
              example:
                success: true
                message: "Commission tier deleted successfully."

  # ========================================
  # COMMISSION RULES
  # ========================================
  /plans/{plan_id}/rules:
    get:
      tags:
        - Commission Rules
      summary: List all rules for a plan
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 1
                    name: "Base Commission"
                    type: "tiered"
                    value: 0
                    priority: 1
                    is_active: true
                    conditions: null
                  - id: 2
                    name: "Quarterly Bonus"
                    type: "bonus_threshold"
                    value: 500
                    priority: 2
                    is_active: true
                    conditions:
                      threshold: 25000
                      period: "quarter"

    post:
      tags:
        - Commission Rules
      summary: Create a new rule
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - value
              properties:
                name:
                  type: string
                  example: "Weekend Bonus"
                type:
                  type: string
                  enum: [percentage, fixed, tiered, bonus_threshold]
                  example: "fixed"
                value:
                  type: number
                  example: 25.00
                priority:
                  type: integer
                  example: 3
                is_active:
                  type: boolean
                  example: true
                conditions:
                  type: object
                  example:
                    day_of_week: ["saturday", "sunday"]
      responses:
        "201":
          description: Rule created successfully
          content:
            application/json:
              example:
                success: true
                message: "Commission rule created successfully."
                data:
                  id: 3
                  name: "Weekend Bonus"
                  type: "fixed"
                  value: 25.00
                  priority: 3
                  is_active: true

  /rules/{id}:
    get:
      tags:
        - Commission Rules
      summary: Get a specific rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful response

    put:
      tags:
        - Commission Rules
      summary: Update a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                value:
                  type: number
                priority:
                  type: integer
                is_active:
                  type: boolean
                conditions:
                  type: object
      responses:
        "200":
          description: Rule updated successfully

    delete:
      tags:
        - Commission Rules
      summary: Delete a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rule deleted successfully
          content:
            application/json:
              example:
                success: true
                message: "Commission rule deleted successfully."

  # ========================================
  # EARNINGS
  # ========================================
  /earnings:
    get:
      tags:
        - Earnings
      summary: List all commission earnings
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, payable, paid, clawed_back]
          description: Filter by status
        - name: period
          in: query
          schema:
            type: string
          description: Filter by period (YYYY-MM format)
          example: "2026-01"
        - name: agent_id
          in: query
          schema:
            type: string
          description: Filter by agent ID
        - name: plan_id
          in: query
          schema:
            type: integer
          description: Filter by plan ID
        - name: from_date
          in: query
          schema:
            type: string
            format: date
          description: Start date filter
        - name: to_date
          in: query
          schema:
            type: string
            format: date
          description: End date filter
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  - id: "01HXK8VDKPWF9G5QJCNM2RY6T3"
                    agent_id: "1"
                    agent_type: "App\\Models\\User"
                    base_amount: 1000.00
                    commission_amount: 100.00
                    rate: 10.00
                    rate_type: "percentage"
                    status: "payable"
                    period: "2026-01"
                    earned_at: "2026-01-15T10:30:00Z"
                  - id: "01HXK8VDKPWF9G5QJCNM2RY6T4"
                    agent_id: "1"
                    agent_type: "App\\Models\\User"
                    base_amount: 2500.00
                    commission_amount: 250.00
                    rate: 10.00
                    rate_type: "percentage"
                    status: "paid"
                    period: "2026-01"
                    earned_at: "2026-01-10T14:20:00Z"
                meta:
                  current_page: 1
                  last_page: 3
                  per_page: 15
                  total: 42

  /earnings/{id}:
    get:
      tags:
        - Earnings
      summary: Get a specific earning
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  id: "01HXK8VDKPWF9G5QJCNM2RY6T3"
                  agent_id: "1"
                  agent_type: "App\\Models\\User"
                  commissionable_type: "App\\Models\\Order"
                  commissionable_id: "456"
                  plan_id: 1
                  tier_id: 3
                  base_amount: 1000.00
                  commission_amount: 100.00
                  rate: 10.00
                  rate_type: "percentage"
                  status: "payable"
                  period: "2026-01"
                  earned_at: "2026-01-15T10:30:00Z"
                  approved_at: "2026-01-15T11:00:00Z"
                  metadata:
                    order_number: "ORD-12345"
                    customer_name: "John Doe"

  /earnings/{id}/mark-payable:
    post:
      tags:
        - Earnings
      summary: Mark an earning as payable
      description: Transitions an earning from pending to payable status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Earning marked as payable
          content:
            application/json:
              example:
                success: true
                message: "Earning marked as payable."
                data:
                  id: "01HXK8VDKPWF9G5QJCNM2RY6T3"
                  status: "payable"
        "400":
          description: Invalid status transition
          content:
            application/json:
              example:
                success: false
                message: "Earning is not in pending status."

  /earnings/by-agent/{agent_id}:
    get:
      tags:
        - Earnings
      summary: Get earnings by agent with summary
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
